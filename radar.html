<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Contributie — Internship Radar</title>
<style>
  :root{
    --bg:#eef1f4;--surface:#fff;--surface-2:#f5f8fa;--border:#dce2e9;
    --ink:#131922;--muted:#5b6773;--faint:#8a95a2;
    --accent:#0b8fa3;--accent-bg:#0b8fa316;
    --merged:#7c4ddb;--review:#b9770a;--awaiting:#2f6fd6;--closed:#6b7684;--ready:#1f9d57;
    --merged-bg:#7c4ddb1f;--review-bg:#b9770a1f;--awaiting-bg:#2f6fd61f;--closed-bg:#6b76841f;--ready-bg:#1f9d571f;
    --strong:#1f9d57;--fit:#2f6fd6;--stretch:#b9770a;--none:#6b7684;
    --strong-bg:#1f9d571f;--fit-bg:#2f6fd61f;--stretch-bg:#b9770a1f;--none-bg:#6b76841f;
    --shadow:0 1px 2px rgba(20,30,45,.05),0 6px 18px rgba(20,30,45,.04);
    --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#0b0f14;--surface:#121822;--surface-2:#0e141c;--border:#222c38;
    --ink:#e7edf3;--muted:#8a97a6;--faint:#5e6a78;
    --accent:#2bc2d6;--accent-bg:#2bc2d61c;
    --merged:#a685f0;--review:#e0a63a;--awaiting:#5a95e8;--closed:#8894a2;--ready:#3fbd72;
    --merged-bg:#a685f024;--review-bg:#e0a63a20;--awaiting-bg:#5a95e820;--closed-bg:#8894a220;--ready-bg:#3fbd7220;
    --strong:#3fbd72;--fit:#5a95e8;--stretch:#e0a63a;--none:#8894a2;
    --strong-bg:#3fbd7220;--fit-bg:#5a95e820;--stretch-bg:#e0a63a20;--none-bg:#8894a220;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.32);
  }}
  :root[data-theme="light"]{--bg:#eef1f4;--surface:#fff;--surface-2:#f5f8fa;--border:#dce2e9;--ink:#131922;--muted:#5b6773;--faint:#8a95a2;--accent:#0b8fa3;--accent-bg:#0b8fa316;--closed:#6b7684;--strong:#1f9d57;--fit:#2f6fd6;--stretch:#b9770a;--none:#6b7684;--strong-bg:#1f9d571f;--fit-bg:#2f6fd61f;--stretch-bg:#b9770a1f;--none-bg:#6b76841f;--shadow:0 1px 2px rgba(20,30,45,.05),0 6px 18px rgba(20,30,45,.04)}
  :root[data-theme="dark"]{--bg:#0b0f14;--surface:#121822;--surface-2:#0e141c;--border:#222c38;--ink:#e7edf3;--muted:#8a97a6;--faint:#5e6a78;--accent:#2bc2d6;--accent-bg:#2bc2d61c;--closed:#8894a2;--strong:#3fbd72;--fit:#5a95e8;--stretch:#e0a63a;--none:#8894a2;--strong-bg:#3fbd7220;--fit-bg:#5a95e820;--stretch-bg:#e0a63a20;--none-bg:#8894a220;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.32)}

  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased}
  .app{display:grid;grid-template-columns:224px minmax(0,1fr) 380px;min-height:100vh;transition:grid-template-columns .18s ease}

  /* Sidebar */
  .sidebar{position:sticky;top:0;height:100vh;overflow-y:auto;border-right:1px solid var(--border);background:var(--surface);padding:16px 14px;display:flex;flex-direction:column;gap:14px}
  .side-head{display:flex;align-items:flex-start;gap:8px}
  .brand{position:relative;overflow:hidden;border-radius:10px;padding:2px 2px 6px;flex:1;min-width:0}
  .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin:0 0 3px}
  .brand h1{font-size:16px;line-height:1.15;margin:0;letter-spacing:-.01em}
  .brand .sub{font-family:var(--mono);font-size:10px;color:var(--faint);margin:3px 0 0;letter-spacing:.02em}
  .collapse-btn{flex:none;width:26px;height:26px;border-radius:7px;border:1px solid var(--border);background:var(--surface-2);color:var(--muted);cursor:pointer;font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center}
  .collapse-btn:hover{color:var(--ink);border-color:var(--accent)}
  .collapse-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* Page switch */
  .pageswitch{display:grid;grid-template-columns:1fr 1fr;gap:3px;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:3px}
  .pageswitch a{font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;text-align:center;padding:6px 4px;border-radius:6px;text-decoration:none;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pageswitch a:hover{color:var(--ink)}
  .pageswitch a.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

  .mini{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .mini .cell{background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:8px 10px}
  .mini .n{font-family:var(--mono);font-size:19px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
  .mini .n.accent{color:var(--accent)} .mini .n.strong{color:var(--strong)}
  .mini .l{font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:5px}
  nav{display:flex;flex-direction:column;gap:2px}
  .navlbl{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:4px 6px 3px}
  .nav-i{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:7px 9px;cursor:pointer;color:var(--muted);font-family:var(--sans);font-size:13px}
  .nav-i:hover{background:var(--surface-2);color:var(--ink)}
  .nav-i.active{background:var(--accent-bg);color:var(--ink)}
  .nav-i .dot{width:7px;height:7px;border-radius:50%;flex:none}
  .nav-i .lft{display:flex;align-items:center;gap:9px;min-width:0}
  .nav-i .ct{font-family:var(--mono);font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
  .nav-i.active .ct{color:var(--accent)}
  .nav-i:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .spacer{flex:1}
  .toggle{font-family:var(--mono);font-size:10.5px;color:var(--muted);background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:7px 10px;cursor:pointer;text-align:left}
  .toggle:hover{color:var(--ink);border-color:var(--accent)}
  .toggle:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .app.collapsed{grid-template-columns:52px minmax(0,1fr) 380px}
  .app.collapsed .sidebar{padding:16px 8px;align-items:stretch}
  .app.collapsed .brand,.app.collapsed .mini,.app.collapsed .navlbl,.app.collapsed .pageswitch,
  .app.collapsed .nav-i .lbl-t,.app.collapsed .nav-i .ct,.app.collapsed .toggle .t{display:none}
  .app.collapsed .side-head{justify-content:center}
  .app.collapsed .nav-i{justify-content:center;padding:9px 0}
  .app.collapsed .nav-i .lft{gap:0}
  .app.collapsed .nav-i .dot{width:9px;height:9px}
  .app.collapsed .toggle{text-align:center;padding:7px 0}

  /* Content */
  .content{padding:20px 24px;min-width:0}
  .head{display:flex;align-items:baseline;gap:10px;margin:2px 0 10px;flex-wrap:wrap}
  .head h2{font-size:17px;margin:0;letter-spacing:-.01em}
  .head .ct{font-family:var(--mono);font-size:12px;color:var(--faint)}
  .head .stamp{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-left:auto}

  .filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
  .chip{font-family:var(--mono);font-size:10.5px;padding:5px 10px;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer}
  .chip:hover{color:var(--ink);border-color:var(--accent)}
  .chip.on{color:var(--ink);border-color:transparent}
  .chip:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .search{flex:1;min-width:130px;max-width:260px;margin-left:auto;font-family:var(--mono);font-size:11.5px;padding:6px 10px;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--ink)}
  .search:focus{outline:2px solid var(--accent);outline-offset:-1px}

  .list{display:flex;flex-direction:column}
  .row{display:grid;grid-template-columns:34px minmax(0,1.05fr) minmax(0,2fr) auto auto;gap:11px;align-items:center;width:100%;text-align:left;background:none;border:0;border-left:2px solid transparent;border-bottom:1px solid var(--border);padding:10px 12px 10px 8px;cursor:pointer;color:inherit;font-family:var(--sans)}
  .list .row:last-child{border-bottom:0}
  .row:hover{background:var(--surface-2)}
  .row.sel{background:var(--accent-bg);border-left-color:var(--accent)}
  .row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .score{font-family:var(--mono);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
  .rco{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rtitle{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row.sel .rtitle{color:var(--ink)}
  .rright{display:flex;gap:5px;align-items:center;justify-self:end}
  .age{font-family:var(--mono);font-size:10.5px;color:var(--faint);white-space:nowrap;font-variant-numeric:tabular-nums;justify-self:end}
  .age.fresh{color:var(--accent);font-weight:600}
  .age.stale{opacity:.55}
  .pay{font-family:var(--mono);font-size:10px;color:var(--strong);white-space:nowrap}
  .empty{color:var(--muted);font-family:var(--mono);font-size:13px;padding:22px;text-align:center}

  /* Badges */
  .trk{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:2px 7px;border-radius:5px;white-space:nowrap}
  .pill{font-family:var(--mono);font-size:10.5px;font-weight:600;padding:4px 9px;border-radius:20px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .t-strong{color:var(--strong);background:var(--strong-bg)}.t-fit{color:var(--fit);background:var(--fit-bg)}
  .t-stretch{color:var(--stretch);background:var(--stretch-bg)}.t-none{color:var(--none);background:var(--none-bg)}
  .lchip{font-family:var(--mono);font-size:9.5px;color:var(--muted);background:var(--surface-2);border:1px solid var(--border);border-radius:20px;padding:2px 8px}
  .lchip.warn{color:var(--stretch);border-color:var(--stretch)}
  .lchip.good{color:var(--strong);border-color:var(--strong)}
  .newdot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none}

  /* Detail */
  .detailbar{position:sticky;top:0;height:100vh;overflow-y:auto;border-left:1px solid var(--border);background:var(--surface);padding:22px 20px}
  .d-back{display:none;position:sticky;top:-2px;background:var(--surface);border:0;color:var(--accent);font-family:var(--mono);font-size:12.5px;cursor:pointer;padding:2px 0 12px;margin:-4px 0 0;width:100%;text-align:left}
  .d-empty{color:var(--faint);font-family:var(--mono);font-size:12.5px;padding:30px 6px;text-align:center}
  .d-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
  .d-co{font-family:var(--mono);font-weight:600;font-size:14px}
  .d-badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .d-title{font-size:15px;line-height:1.32;margin:0 0 10px;letter-spacing:-.01em}
  .d-why{font-size:13px;color:var(--muted);line-height:1.55;margin:0 0 14px}
  .d-k{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:0 0 7px}
  /* display:block matters — these are spans, and an inline box ignores height
     and width, so the fill never renders. */
  .bar .bt{display:block;height:7px;border-radius:4px;background:var(--surface-2);border:1px solid var(--border);overflow:hidden}
  .bar .bf{display:block;height:100%;border-radius:4px;min-width:2px}
  .bar .bv{font-family:var(--mono);font-size:11px;font-variant-numeric:tabular-nums;text-align:right;color:var(--ink)}
  .d-meta{display:grid;grid-template-columns:1fr 1fr;gap:9px 14px;font-family:var(--mono);font-size:11.5px;margin:0 0 14px;padding:12px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
  .d-meta .k{color:var(--faint);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase} .d-meta .v{color:var(--ink);margin-top:2px;word-break:break-word}
  .d-meta .wide{grid-column:1 / -1}
  .d-labels{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 14px}
  .appbox{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:11px 12px;margin:0 0 14px}
  .app-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
  .app-s{font-weight:600;font-size:13px}
  .app-r{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
  .app-n{font-size:12px;color:var(--muted);line-height:1.5;margin-top:6px}
  .app-n.flag{color:var(--stretch)}
  .d-open{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;color:var(--accent);text-decoration:none;border:1px solid var(--border);border-radius:8px;padding:8px 12px}
  .d-open:hover{border-color:var(--accent);background:var(--accent-bg)}

  @media (max-width:900px){
    .app,.app.collapsed{grid-template-columns:224px minmax(0,1fr)}
    .d-back{display:block}
    .detailbar{position:fixed;inset:0;z-index:60;height:100vh;height:100dvh;width:auto;border-left:0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));transform:translateX(100%);transition:transform .22s ease;box-shadow:-8px 0 30px rgba(0,0,0,.18)}
    .app.detail-open .detailbar{transform:translateX(0)}
  }
  @media (max-width:720px){
    .app,.app.collapsed{grid-template-columns:1fr}
    .sidebar{position:static;height:auto;border-right:0;border-bottom:1px solid var(--border);gap:12px}
    .side-head{align-items:center}
    nav{flex-direction:row;flex-wrap:wrap;gap:5px}.navlbl{display:none}
    .nav-i{width:auto;border:1px solid var(--border);padding:6px 10px}.nav-i .ct{margin-left:2px}
    .spacer{display:none}.toggle{align-self:flex-start}
    .mini{grid-template-columns:repeat(4,1fr)} .mini .n{font-size:17px}
    .content{padding:16px 14px}
    .head h2{font-size:16px}
    .row{grid-template-columns:30px minmax(0,1fr) auto auto;gap:9px;padding:12px 8px}
    .row .rtitle{grid-column:2 / -1;grid-row:2}
    .search{margin-left:0;max-width:none}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="side-head">
      <div class="brand">
        <p class="eyebrow">Contributie</p>
        <h1>Internship radar</h1>
        <p class="sub" id="focus">Internships &amp; co-ops</p>
      </div>
      <button class="collapse-btn" id="collapseBtn" aria-label="Collapse sidebar" title="Collapse">«</button>
    </div>
    <div class="pageswitch">
      <a href="./index.html">PRs</a>
      <a href="./radar.html" class="on" aria-current="page">Jobs</a>
    </div>
    <div class="mini" id="mini"></div>
    <nav id="nav"><div class="navlbl">Sections</div></nav>
    <div class="spacer"></div>
    <button class="toggle" id="themeBtn">◐<span class="t"> theme</span></button>
  </aside>
  <main class="content">
    <div class="head">
      <h2 id="secTitle">…</h2><span class="ct" id="secCount"></span>
      <span class="stamp" id="stamp"></span>
    </div>
    <div class="filters" id="filters"></div>
    <div class="list" id="list"></div>
  </main>
  <aside class="detailbar" id="detail">
    <button class="d-back" id="dBack">← Back to list</button>
    <div id="detailBody"><div class="d-empty">Select a role to see details.</div></div>
  </aside>
</div>

<script>
const esc=s=>(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const TIER_LABEL={strong:"Strong fit",fit:"Fit",stretch:"Stretch",none:"Low"};
const TIER_VAR={strong:"var(--strong)",fit:"var(--fit)",stretch:"var(--stretch)",none:"var(--none)"};
const STATUS_LABEL={none:"Not applied",applied:"Applied",in_progress:"In progress",
  phone_screen:"Phone screen",rejected:"Rejected",offer:"Offer"};

let DATA=null, RESUMES=[], RMAP={}, FILTER="fresh", TRACK="all", QUERY="", SORT="new", SEL=null, CUR=[], TODAY="";

const trackBadge=id=>{const r=RMAP[id];if(!r)return"";
  return `<span class="trk" style="color:${r.color};background:${r.color}22">${esc(r.label)}</span>`;};
const tierPill=t=>`<span class="pill t-${t}">${TIER_LABEL[t]||t}</span>`;
const best=r=>r.tracks?(r.tracks[r.best_track]||0):0;

function rowHTML(r,sel){
  const a=ageDays(r);
  const isNew = a!==null && a<=3 && r.application.status==="none";
  return `<button class="row${r.id===sel?" sel":""}" data-id="${esc(r.id)}">
    <span class="score" style="color:${TIER_VAR[r.tier]}">${best(r)}</span>
    <span class="rco">${isNew?'<span class="newdot"></span> ':""}${esc(r.company)}</span>
    <span class="rtitle">${esc(r.title)}</span>
    <span class="rright">${trackBadge(r.best_track)}</span>
    <span class="age ${ageCls(a)}" title="${r.posted?"posted "+esc(r.posted):"first seen "+esc(r.found)}">${ageShort(a)}</span>
  </button>`;
}

function eligChips(r){
  const e=r.eligibility||{}, out=[];
  if(e.sponsorship===true) out.push('<span class="lchip good">sponsors visas</span>');
  if(e.sponsorship===false) out.push('<span class="lchip warn">no sponsorship</span>');
  if(e.citizenship) out.push(`<span class="lchip warn">${esc(e.citizenship)}</span>`);
  if(r.pay) out.push(`<span class="lchip good">${esc(r.pay)}</span>`);
  if(r.paid===false) out.push('<span class="lchip warn">unpaid</span>');
  if(r.season) out.push(`<span class="lchip">${esc(r.season)}</span>`);
  if(r.workmode&&r.workmode!=="unspecified") out.push(`<span class="lchip">${esc(r.workmode)}</span>`);
  return out.length?`<div class="d-labels">${out.join("")}</div>`:"";
}

function appBlock(r){
  const a=r.application||{};
  if(a.status==="none"&&!a.attempt_state) return "";
  const flag=(a.notes||"").startsWith("needs_human");
  return `<div class="d-k">Application</div><div class="appbox">
    <div class="app-h"><span class="app-s">${STATUS_LABEL[a.status]||a.status}</span>
      <span class="app-r">${a.applied?esc(a.applied):"date not recorded"}</span></div>
    <div class="app-r">resume: ${a.resume?esc(RMAP[a.resume]?.label||a.resume):"—"}${a.sheet_row?` · sheet row ${a.sheet_row}`:""}</div>
    ${a.attempt_state?`<div class="app-r">Hermes: ${esc(a.attempt_state)}</div>`:""}
    ${a.attempt_detail?`<div class="app-n${flag?" flag":""}">${esc(a.attempt_detail)}</div>`:""}
    ${a.notes?`<div class="app-n${flag?" flag":""}">${esc(a.notes)}</div>`:""}
  </div>`;
}

function manualAppliedButton(r){
  if((r.application||{}).status!=="none") return "";
  if(!CFG.api) return "";
  return `<button class="d-open" id="markApplied" data-id="${esc(r.id)}">Mark as applied</button>
    <span id="markAppliedMsg" class="app-n"></span>`;
}

/* Marks the role applied and moves it straight into the Applied section.
   No page to visit, so this works wherever the dashboard itself loads. */
async function markApplied(roleId, button){
  const msg=document.getElementById("markAppliedMsg");
  button.disabled=true;
  if(msg) msg.textContent="Marking…";
  try{
    const response=await fetch(
      `${CFG.api}/manual/${encodeURIComponent(roleId)}/applied`,
      {method:"POST", headers:apiHeaders()});
    if(!response.ok){
      const body=await response.json().catch(()=>({}));
      throw new Error(body.detail||`API ${response.status}`);
    }
    const role=DATA.roles.find(x=>x.id===roleId);
    if(role){
      role.application.status="applied";
      role.application.applied=new Date().toISOString().slice(0,10);
      role.application.resume=role.best_track;
    }
    renderMini(); renderNav(); renderSection(); renderDetail();
  }catch(e){
    button.disabled=false;
    if(msg) msg.textContent=String(e.message||e);
  }
}

function activityHTML(a){
  const attempts=(a.attempts||[]).map(x=>`<li><strong>${esc(x.state)}</strong> · ${esc(x.resume)}
    ${x.dry_run?" · dry run":""}<br><small>${esc(x.detail||"")}</small></li>`).join("");
  const questions=(a.questions||[]).map(x=>`<li>${esc(x.normalized_text)}
    <br><small>${esc(x.category)} · ${esc(x.disposition)}</small></li>`).join("");
  const events=(a.events||[]).map(x=>`<li><strong>${esc(x.event)}</strong> — ${esc(x.detail||"")}</li>`).join("");
  return `<div class="d-k">Hermes attempts</div><div class="appbox"><ul>${attempts||"<li>None</li>"}</ul>
    <div class="d-k">Questions</div><ul>${questions||"<li>None</li>"}</ul>
    <div class="d-k">Events</div><ul>${events||"<li>None</li>"}</ul></div>`;
}

function detailHTML(r){
  const also=(r.also_tracks||[]).map(trackBadge).join("");
  return `<div class="d-top"><span class="d-co">${esc(r.company)}</span>${tierPill(r.tier)}</div>
    <div class="d-badges">${trackBadge(r.best_track)}${also}</div>
    <p class="d-title">${esc(r.title)}</p>
    ${r.why?`<p class="d-why">${esc(r.why)}</p>`:""}
    ${eligChips(r)}
    <div class="d-meta">
      <div class="wide"><div class="k">Location</div><div class="v">${esc(r.location||"—")}</div></div>
      <div><div class="k">Posted</div><div class="v">${ageLong(ageDays(r))}${r.posted?` · ${esc(r.posted)}`:""}</div></div>
      <div><div class="k">Found</div><div class="v">${esc(r.found||"—")}</div></div>
      <div class="wide"><div class="k">Pay</div><div class="v">${r.pay?esc(r.pay):(r.paid===true?"stated as paid, no range given":r.paid===false?"UNPAID":"not stated in the posting")}</div></div>
      <div><div class="k">Source</div><div class="v">${esc(r.source||"—")}</div></div>
      <div><div class="k">Season</div><div class="v">${esc(r.season||"—")}</div></div>
    </div>
    ${(r.tags||[]).length?`<div class="d-k">Skills named</div><div class="d-labels">${r.tags.map(t=>`<span class="lchip">${esc(t)}</span>`).join("")}</div>`:""}
    ${appBlock(r)}
    ${manualAppliedButton(r)}
    ${r.url?`<a class="d-open" href="${esc(r.url)}" target="_blank" rel="noopener">Open the posting ↗</a>`
            :'<div class="d-empty">No link recorded — this row came from the spreadsheet.</div>'}`;
}

const DAY=86400000;
function ageDays(r){
  const d=r.posted||r.found; if(!d) return null;
  const t=Date.parse(d+"T00:00:00Z"); if(isNaN(t)) return null;
  return Math.max(0,Math.floor((Date.now()-t)/DAY));
}
const ageShort=n=>n===null?"—":n===0?"today":n+"d";
const ageLong=n=>n===null?"not stated":n===0?"today":n===1?"yesterday":n+" days ago";
const ageCls=n=>n===null?"":n<=3?"fresh":n>30?"stale":"";
const applied=r=>r.application.status!=="none";
const SECTIONS=[
  {key:"fresh",  label:"Last 3 days", color:"var(--accent)", get:d=>d.filter(r=>(ageDays(r)??99)<=3&&!applied(r)&&!r.dead&&r.tier!=="none")},
  {key:"strong", label:"Strong fit", color:"var(--strong)", get:d=>d.filter(r=>r.tier==="strong"&&!applied(r)&&!r.dead)},
  {key:"open",   label:"All open",   color:"var(--fit)",    get:d=>d.filter(r=>!applied(r)&&!r.dead&&r.tier!=="none")},
  // Every role with a status lives here, rejections included, so this tab
  // always matches the "Applied" stat card.
  {key:"applied",label:"Applied",    color:"var(--merged)", get:d=>d.filter(applied)},
];

function visible(){
  let rows=SECTIONS.find(s=>s.key===FILTER).get(DATA.roles);
  if(TRACK!=="all") rows=rows.filter(r=>r.best_track===TRACK||(r.also_tracks||[]).includes(TRACK));
  if(QUERY){const q=QUERY.toLowerCase();
    rows=rows.filter(r=>(r.company+" "+r.title+" "+(r.tags||[]).join(" ")).toLowerCase().includes(q));}
  const key = FILTER==="applied"
    ? (a,b)=>String(b.application.applied||"").localeCompare(String(a.application.applied||""))
    : SORT==="new"
      ? (a,b)=>(ageDays(a)??9e9)-(ageDays(b)??9e9)||best(b)-best(a)
      : (a,b)=>best(b)-best(a)||(ageDays(a)??9e9)-(ageDays(b)??9e9);
  return rows.sort(key);
}

function renderFilters(){
  const chips=[["all","All"]].concat(RESUMES.map(r=>[r.id,r.label]));
  document.getElementById("filters").innerHTML=
    chips.map(([k,l])=>{
      const on=k===TRACK, c=k==="all"?"var(--accent)":RMAP[k].color;
      return `<button class="chip${on?" on":""}" data-t="${k}"${on?` style="background:${c}22;color:${c}"`:""}>${esc(l)}</button>`;
    }).join("")+
    `<span class="chip" style="border:0;background:none;cursor:default;color:var(--faint)">sort</span>`+
    [["fit","best fit"],["new","newest"]].map(([k,l])=>
      `<button class="chip${k===SORT?" on":""}" data-s="${k}"${k===SORT?' style="background:var(--accent-bg);color:var(--accent)"':""}>${l}</button>`).join("")+
    `<input class="search" id="q" type="search" placeholder="filter company, title, skill" value="${esc(QUERY)}">`;
  document.querySelectorAll("[data-t]").forEach(b=>b.addEventListener("click",()=>{
    TRACK=b.dataset.t;SEL=null;renderFilters();renderSection();}));
  document.querySelectorAll("[data-s]").forEach(b=>b.addEventListener("click",()=>{
    SORT=b.dataset.s;SEL=null;renderFilters();renderSection();}));
  const q=document.getElementById("q");
  q.addEventListener("input",()=>{QUERY=q.value;SEL=null;renderSection();
    const el=document.getElementById("q");el.focus();el.setSelectionRange(el.value.length,el.value.length);});
}

function renderNav(){
  const nav=document.getElementById("nav");
  nav.innerHTML='<div class="navlbl">Sections</div>'+SECTIONS.map(s=>{
    const n=s.get(DATA.roles).length;
    return `<button class="nav-i${s.key===FILTER?" active":""}" data-k="${s.key}" title="${s.label} · ${n}">
      <span class="lft"><span class="dot" style="background:${s.color}"></span><span class="lbl-t">${s.label}</span></span><span class="ct">${n}</span></button>`;
  }).join("");
  nav.querySelectorAll(".nav-i").forEach(b=>b.addEventListener("click",()=>{
    FILTER=b.dataset.k;SEL=null;document.querySelector(".app").classList.remove("detail-open");
    renderNav();renderSection();}));
}

async function renderDetail(){
  const r=CUR.find(x=>x.id===SEL);
  const el=document.getElementById("detailBody");
  el.innerHTML = r?detailHTML(r):'<div class="d-empty">Select a role to see details.</div>';
  document.getElementById("detail").scrollTop=0;
  if(r&&CFG.api){
    try{
      const response=await fetch(`${CFG.api}/roles/${encodeURIComponent(r.id)}/activity`,
        {cache:"no-store",headers:apiHeaders()});
      if(response.ok&&SEL===r.id) el.insertAdjacentHTML("beforeend",activityHTML(await response.json()));
    }catch(_){}
  }
}

function renderSection(){
  const s=SECTIONS.find(x=>x.key===FILTER);
  CUR=visible();
  if(!SEL&&CUR.length) SEL=CUR[0].id;
  document.getElementById("secTitle").textContent=s.label;
  document.getElementById("secCount").textContent=CUR.length?`${CUR.length} ${CUR.length===1?"role":"roles"}`:"";
  const list=document.getElementById("list");
  list.innerHTML=CUR.length?CUR.map(r=>rowHTML(r,SEL)).join(""):'<div class="empty">Nothing here right now.</div>';
  list.querySelectorAll(".row").forEach(b=>b.addEventListener("click",()=>{
    SEL=b.dataset.id;
    history.replaceState(null,"",`#role=${encodeURIComponent(SEL)}`);
    list.querySelectorAll(".row").forEach(x=>x.classList.toggle("sel",x.dataset.id===SEL));
    renderDetail();document.querySelector(".app").classList.add("detail-open");}));
  renderDetail();
}

function renderMini(){
  const r=DATA.roles;
  const cells=[
    {n:r.filter(x=>(ageDays(x)??99)<=3&&!applied(x)&&x.tier!=="none").length,l:"≤3 days",cls:"accent"},
    {n:r.filter(x=>x.tier==="strong"&&!applied(x)).length,l:"Strong",cls:"strong"},
    {n:r.filter(applied).length,l:"Applied"},
    {n:r.filter(x=>x.application.status==="rejected").length,l:"Rejected"},
  ];
  document.getElementById("mini").innerHTML=cells.map(x=>
    `<div class="cell"><div class="n ${x.cls||""}">${x.n}</div><div class="l">${x.l}</div></div>`).join("");
}

/* Data source, in order of preference:
     1. Supabase  — live, no server. ?sb=https://xxx.supabase.co&key=<anon key>
     2. A self-hosted API          — ?api=https://host
     3. data/roles.json            — the static snapshot, always works offline
   The choice is kept in localStorage, so it survives a reload. Pass an empty
   value (?sb= or ?api=) to clear it and fall back to the file. */
const CFG=(()=>{
  const q=new URLSearchParams(location.search), get=k=>{
    if(q.has(k)){const v=(q.get(k)||"").replace(/\/$/,"");
      v?localStorage.setItem("ctb-"+k,v):localStorage.removeItem("ctb-"+k);}
    return localStorage.getItem("ctb-"+k)||"";
  };
  return {sb:get("sb"), key:get("key"), api:get("api")};
})();

const RESUME_DEFS=[
  {id:"swe",label:"SWE",color:"#2f6fd6"},
  {id:"ml",label:"ML",color:"#7c4ddb"},
  {id:"hwv",label:"HW Verif",color:"#12b5a5"},
];

/* Both live sources return flat rows; the page wants the nested shape. */
function inflate(rows){
  return rows.map(x=>({...x,
    tracks:{swe:x.score_swe,ml:x.score_ml,hwv:x.score_hwv},
    also_tracks:x.also_tracks||[],
    eligibility:{sponsorship:x.sponsorship,citizenship:x.citizenship,class_year:[]},
    application:{status:x.status||"none",applied:x.applied,resume:x.resume,
                 notes:x.notes||"",sheet_row:x.sheet_row??null,
                 attempt_state:x.attempt_state||"",attempt_detail:x.attempt_detail||"",
                 attempt_updated_at:x.attempt_updated_at||null}}));
}

async function fromSupabase(){
  const url=`${CFG.sb}/rest/v1/radar?select=*&order=age_days.asc.nullslast&limit=2000`;
  const r=await fetch(url,{cache:"no-store",
    headers:{apikey:CFG.key, Authorization:`Bearer ${CFG.key}`}});
  if(!r.ok) throw new Error(`Supabase ${r.status} — check the anon key`);
  const rows=await r.json();
  return {meta:{live:"supabase",total:rows.length},resumes:RESUME_DEFS,roles:inflate(rows)};
}

function apiHeaders(){
  return CFG.key?{Authorization:`Bearer ${CFG.key}`}:{};
}

/* The API caps a page at 500, so walk offsets until the board is exhausted.
   A single page silently dropped the oldest roles, which are the applied
   ones, and the tab counts then disagreed with the stat cards. */
const API_PAGE=500;
async function fromAPI(){
  const roles=[]; let total=null;
  for(let offset=0; offset<20000; offset+=API_PAGE){
    const r=await fetch(
      `${CFG.api}/roles?limit=${API_PAGE}&offset=${offset}&sort=fresh&include_dead=true`,
      {cache:"no-store",headers:apiHeaders()});
    if(!r.ok) throw new Error(`API ${r.status}`);
    const j=await r.json();
    if(total===null) total=j.total;
    const page=j.roles||[];
    roles.push(...page);
    if(page.length<API_PAGE) break;
  }
  return {meta:{live:"api",total:total??roles.length},resumes:RESUME_DEFS,roles:inflate(roles)};
}

async function boot(){
  const source = CFG.sb&&CFG.key ? "supabase" : CFG.api ? "api" : "file";
  try{
    DATA = source==="supabase" ? await fromSupabase()
         : source==="api"      ? await fromAPI()
         : await (await fetch("./data/roles.json",{cache:"no-store"})).json();
  }
  catch(e){ document.getElementById("list").innerHTML=
    `<div class="empty">Couldn't load from ${esc(source)} — ${esc(String(e))}</div>`;
    return; }
  RESUMES=DATA.resumes||[]; RESUMES.forEach(r=>RMAP[r.id]=r);
  // "Today" means the newest harvest date in the file, so the page is never empty
  // just because nothing was polled today.
  TODAY=DATA.roles.reduce((m,r)=>r.found>m?r.found:m,"");
  const linked=new URLSearchParams(location.hash.slice(1)).get("role");
  if(linked&&DATA.roles.some(r=>r.id===linked)){
    SEL=linked;
    const r=DATA.roles.find(x=>x.id===linked);
    // Land on a tab that actually contains the linked role, whatever its state.
    const home=SECTIONS.find(s=>s.get(DATA.roles).some(x=>x.id===linked));
    FILTER=home?home.key:"applied";
  }
  document.getElementById("stamp").textContent = DATA.meta?.live
    ? `${DATA.meta.total ?? DATA.roles.length} roles · live (${DATA.meta.live})`
    : `${DATA.roles.length} roles · snapshot ${TODAY}`;
  renderMini(); renderFilters(); renderNav(); renderSection();
}
/* Delegated: the detail pane's innerHTML is replaced on every render. */
document.getElementById("detailBody").addEventListener("click",event=>{
  const button=event.target.closest("#markApplied");
  if(button) markApplied(button.dataset.id,button);
});
document.getElementById("themeBtn").addEventListener("click",()=>{
  const now=document.documentElement.getAttribute("data-theme");
  const isDark=now?now==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
  document.documentElement.setAttribute("data-theme",isDark?"light":"dark");
});
const app=document.querySelector(".app"), cbtn=document.getElementById("collapseBtn");
if(localStorage.getItem("ctb-collapsed")==="1") app.classList.add("collapsed");
function syncCollapse(){const c=app.classList.contains("collapsed");cbtn.textContent=c?"»":"«";cbtn.title=c?"Expand":"Collapse";}
cbtn.addEventListener("click",()=>{app.classList.toggle("collapsed");
  localStorage.setItem("ctb-collapsed",app.classList.contains("collapsed")?"1":"0");syncCollapse();});
document.getElementById("dBack").addEventListener("click",()=>app.classList.remove("detail-open"));
syncCollapse();
boot();
</script>
