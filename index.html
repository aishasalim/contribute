<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Contributie — Open-Source Contribution Tracker</title>
<style>
  :root{
    --bg:#eef1f4;--surface:#fff;--surface-2:#f5f8fa;--border:#dce2e9;
    --ink:#131922;--muted:#5b6773;--faint:#8a95a2;
    --accent:#0b8fa3;--accent-bg:#0b8fa316;
    --merged:#7c4ddb;--review:#b9770a;--awaiting:#2f6fd6;--closed:#6b7684;--ready:#1f9d57;
    --merged-bg:#7c4ddb1f;--review-bg:#b9770a1f;--awaiting-bg:#2f6fd61f;--closed-bg:#6b76841f;--ready-bg:#1f9d571f;
    --shadow:0 1px 2px rgba(20,30,45,.05),0 6px 18px rgba(20,30,45,.04);
    --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#0b0f14;--surface:#121822;--surface-2:#0e141c;--border:#222c38;
    --ink:#e7edf3;--muted:#8a97a6;--faint:#5e6a78;
    --accent:#2bc2d6;--accent-bg:#2bc2d61c;
    --merged:#a685f0;--review:#e0a63a;--awaiting:#5a95e8;--closed:#8894a2;--ready:#3fbd72;
    --merged-bg:#a685f024;--review-bg:#e0a63a20;--awaiting-bg:#5a95e820;--closed-bg:#8894a220;--ready-bg:#3fbd7220;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.32);
  }}
  :root[data-theme="light"]{--bg:#eef1f4;--surface:#fff;--surface-2:#f5f8fa;--border:#dce2e9;--ink:#131922;--muted:#5b6773;--faint:#8a95a2;--accent:#0b8fa3;--accent-bg:#0b8fa316;--merged:#7c4ddb;--review:#b9770a;--awaiting:#2f6fd6;--closed:#6b7684;--ready:#1f9d57;--merged-bg:#7c4ddb1f;--review-bg:#b9770a1f;--awaiting-bg:#2f6fd61f;--closed-bg:#6b76841f;--ready-bg:#1f9d571f;--shadow:0 1px 2px rgba(20,30,45,.05),0 6px 18px rgba(20,30,45,.04)}
  :root[data-theme="dark"]{--bg:#0b0f14;--surface:#121822;--surface-2:#0e141c;--border:#222c38;--ink:#e7edf3;--muted:#8a97a6;--faint:#5e6a78;--accent:#2bc2d6;--accent-bg:#2bc2d61c;--merged:#a685f0;--review:#e0a63a;--awaiting:#5a95e8;--closed:#8894a2;--ready:#3fbd72;--merged-bg:#a685f024;--review-bg:#e0a63a20;--awaiting-bg:#5a95e820;--closed-bg:#8894a220;--ready-bg:#3fbd7220;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.32)}

  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased}
  .app{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100vh}

  /* Sidebar */
  .sidebar{position:sticky;top:0;height:100vh;overflow-y:auto;border-right:1px solid var(--border);background:var(--surface);padding:16px 14px;display:flex;flex-direction:column;gap:14px}
  .brand{position:relative;overflow:hidden;border-radius:10px;padding:2px 2px 6px}
  .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin:0 0 3px}
  .brand h1{font-size:16px;line-height:1.15;margin:0;letter-spacing:-.01em}
  .brand .sub{font-family:var(--mono);font-size:10px;color:var(--faint);margin:3px 0 0;letter-spacing:.02em}

  .mini{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .mini .cell{background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:8px 10px}
  .mini .n{font-family:var(--mono);font-size:19px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
  .mini .n.accent{color:var(--accent)} .mini .n.merged{color:var(--merged)}
  .mini .l{font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:5px}

  nav{display:flex;flex-direction:column;gap:2px}
  .navlbl{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:4px 6px 3px}
  .nav-i{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:7px 9px;cursor:pointer;color:var(--muted);font-family:var(--sans);font-size:13px}
  .nav-i:hover{background:var(--surface-2);color:var(--ink)}
  .nav-i.active{background:var(--accent-bg);color:var(--ink)}
  .nav-i .dot{width:7px;height:7px;border-radius:50%;flex:none}
  .nav-i .lft{display:flex;align-items:center;gap:9px;min-width:0}
  .nav-i .ct{font-family:var(--mono);font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
  .nav-i.active .ct{color:var(--accent)}
  .nav-i:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

  .spacer{flex:1}
  .toggle{font-family:var(--mono);font-size:10.5px;color:var(--muted);background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:7px 10px;cursor:pointer;text-align:left}
  .toggle:hover{color:var(--ink);border-color:var(--accent)}
  .toggle:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* Content */
  .content{padding:22px 26px;min-width:0;max-width:840px}
  .head{display:flex;align-items:baseline;gap:10px;margin:2px 0 16px}
  .head h2{font-size:18px;margin:0;letter-spacing:-.01em}
  .head .ct{font-family:var(--mono);font-size:12px;color:var(--faint)}
  .records{display:flex;flex-direction:column;gap:11px}
  .empty{color:var(--muted);font-family:var(--mono);font-size:13px;padding:24px;border:1px dashed var(--border);border-radius:12px}

  .rec{background:var(--surface);border:1px solid var(--border);border-radius:11px;box-shadow:var(--shadow);padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:5px 14px;align-items:start;text-decoration:none;color:inherit;transition:border-color .15s,transform .15s}
  .rec:hover{border-color:var(--accent);transform:translateY(-1px)}
  .rec:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .rec-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .proj{font-family:var(--mono);font-weight:600;font-size:13px}
  .id{font-family:var(--mono);font-size:11.5px;color:var(--faint)}
  .lang{font-family:var(--mono);font-size:10px;color:var(--muted);border:1px solid var(--border);border-radius:5px;padding:1px 6px 1px 5px;display:inline-flex;align-items:center;gap:5px}
  .lang .dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
  .kind{font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;padding:2px 7px;border-radius:5px;white-space:nowrap}
  .k-docs{color:var(--awaiting);background:var(--awaiting-bg)} .k-fix{color:var(--ready);background:var(--ready-bg)} .k-feature{color:var(--merged);background:var(--merged-bg)}
  .title{font-size:14px;margin:6px 0 0;grid-column:1/2;color:var(--ink)}
  .recap{grid-column:1/2;margin:7px 0 0;font-size:12.5px;color:var(--muted);line-height:1.5;max-width:72ch}
  .meta{grid-column:1/2;margin-top:8px;display:flex;align-items:center;gap:13px;flex-wrap:wrap;font-family:var(--mono);font-size:11px;color:var(--muted)}
  .add-t{color:#2f9e57}.del-t{color:#d0555f}
  .cmt{grid-column:1/2;margin-top:8px;font-size:12px;color:var(--faint);border-left:2px solid var(--border);padding-left:10px}
  .cmt b{color:var(--muted);font-family:var(--mono);font-weight:600;font-size:11px}
  .why{grid-column:1/2;margin-top:6px;font-size:12px;color:var(--muted)}
  .why::before{content:"why ";font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--faint);text-transform:uppercase}
  .side{display:flex;flex-direction:column;align-items:flex-end;gap:7px;grid-row:1/4}
  .pill{font-family:var(--mono);font-size:10.5px;font-weight:600;padding:4px 9px;border-radius:20px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .pill svg{width:11px;height:11px}
  .st-merged{color:var(--merged);background:var(--merged-bg)}.st-review{color:var(--review);background:var(--review-bg)}
  .st-awaiting{color:var(--awaiting);background:var(--awaiting-bg)}.st-closed{color:var(--closed);background:var(--closed-bg)}
  .st-ready{color:var(--ready);background:var(--ready-bg)}.st-watch{color:var(--awaiting);background:var(--awaiting-bg)}
  .org{font-family:var(--mono);font-size:10px;color:var(--muted)} .arrow{color:var(--faint);font-size:13px}

  @media (max-width:720px){
    .app{grid-template-columns:1fr}
    .sidebar{position:static;height:auto;border-right:0;border-bottom:1px solid var(--border);flex-direction:column}
    nav{flex-direction:row;flex-wrap:wrap} .navlbl{display:none}
    .nav-i{width:auto} .spacer{display:none} .content{max-width:none;padding:18px}
    .rec{grid-template-columns:1fr}.side{grid-row:auto;flex-direction:row;align-items:flex-start}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <p class="eyebrow">Contributie</p>
      <h1>Contribution tracker</h1>
      <p class="sub" id="focus">HW verification &amp; EDA</p>
    </div>
    <div class="mini" id="mini"></div>
    <nav id="nav"><div class="navlbl">Sections</div></nav>
    <div class="spacer"></div>
    <button class="toggle" id="themeBtn">◐ theme</button>
  </aside>
  <main class="content">
    <div class="head"><h2 id="secTitle">…</h2><span class="ct" id="secCount"></span></div>
    <div id="main"></div>
  </main>
</div>

<script>
const ICON={
  merged:'<svg viewBox="0 0 16 16" fill="currentColor"><path d="M5 3.25a1.75 1.75 0 1 0-2.5 1.58v6.34a1.75 1.75 0 1 0 1.5 0V8.06c.3.2.66.32 1.05.36l2.2.23a1.75 1.75 0 0 0 1.74 1.6 1.75 1.75 0 1 0-.17-3.49l-2.2-.23A1.06 1.06 0 0 1 5 5.47Z"/></svg>',
  review:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 4v4l2.5 1.5"/><circle cx="8" cy="8" r="6"/></svg>',
  awaiting:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="6"/><path d="M8 8h3"/></svg>',
  closed:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 5l6 6M11 5l-6 6"/></svg>',
  ready:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 8.5 6.5 12 13 4"/></svg>',
  watch:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 8s2.5-5 7-5 7 5 7 5-2.5 5-7 5-7-5-7-5Z"/><circle cx="8" cy="8" r="2"/></svg>',
};
const LABEL={merged:"Merged",review:"In review",awaiting:"Awaiting review",closed:"Closed",ready:"Ready to pick up",watch:"Watch"};
const LANG_COLOR={"C++":"#f34b7d","Python":"#3572A5","Dart":"#00B4AB","SystemVerilog/UVM":"#12b5a5","SystemVerilog":"#12b5a5","Verilog":"#b2b7f8"};
const esc=s=>(s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const pill=s=>`<span class="pill st-${s}">${ICON[s]||""}${LABEL[s]||s}</span>`;
const langBadge=l=>`<span class="lang"><span class="dot" style="background:${LANG_COLOR[l]||"var(--faint)"}"></span>${esc(l)}</span>`;
const kindBadge=k=>k?`<span class="kind k-${esc(k)}">${esc(k)}</span>`:"";

function contribCard(r){return `<a class="rec" href="${r.url}" target="_blank" rel="noopener">
  <div class="rec-head"><span class="proj">${esc(r.project)}</span><span class="id">#${r.id}</span>${langBadge(r.lang)}${kindBadge(r.kind)}</div>
  <p class="title">${esc(r.title)}</p>
  ${r.recap?`<p class="recap">${esc(r.recap)}</p>`:""}
  <div class="meta"><span><span class="add-t">+${r.additions??0}</span> <span class="del-t">−${r.deletions??0}</span></span>
    <span>${r.files??0} file${r.files===1?"":"s"}</span>
    <span>${esc(r.created||"")}${r.ended?" → "+esc(r.ended):" → …"}</span>
    ${r.reviewer?`<span>◍ ${esc(r.reviewer)}</span>`:""}</div>
  ${r.latest_comment?`<div class="cmt"><b>${esc(r.latest_comment.author)}</b> · ${esc(r.latest_comment.at||"")} — ${esc(r.latest_comment.body)}</div>`:""}
  <div class="side">${pill(r.status)}<span class="org">${esc(r.org)}</span><span class="arrow">↗</span></div></a>`;}

function leadCard(p){const st=p.readiness==="ready"?"ready":"watch";return `<a class="rec" href="${p.url}" target="_blank" rel="noopener">
  <div class="rec-head"><span class="proj">${esc(p.repo.split("/")[1]||p.repo)}</span><span class="id">#${p.issue}</span>${langBadge(p.lang)}</div>
  <p class="title">${esc(p.title)}</p>
  ${p.why?`<p class="why">${esc(p.why)}</p>`:""}
  <div class="side">${pill(st)}<span class="org">${esc(p.org)}</span><span class="arrow">↗</span></div></a>`;}

let DATA=null, FILTER="active";
const SECTIONS=[
  {key:"active",  label:"In review",     color:"var(--review)",  get:d=>d.contributions.filter(r=>r.status==="review"||r.status==="awaiting"), card:contribCard},
  {key:"merged",  label:"Merged",        color:"var(--merged)",  get:d=>d.contributions.filter(r=>r.status==="merged"), card:contribCard},
  {key:"prs",     label:"Potential PRs", color:"var(--ready)",   get:d=>d.potential_prs||[], card:leadCard},
  {key:"watch",   label:"Watchlist",     color:"var(--awaiting)",get:d=>d.potential_issues||[], card:leadCard},
  {key:"closed",  label:"Closed",        color:"var(--closed)",  get:d=>d.contributions.filter(r=>r.status==="closed"), card:contribCard},
];

function renderNav(){
  const nav=document.getElementById("nav");
  nav.innerHTML='<div class="navlbl">Sections</div>'+SECTIONS.map(s=>{
    const n=s.get(DATA).length;
    return `<button class="nav-i${s.key===FILTER?" active":""}" data-k="${s.key}">
      <span class="lft"><span class="dot" style="background:${s.color}"></span>${s.label}</span><span class="ct">${n}</span></button>`;
  }).join("");
  nav.querySelectorAll(".nav-i").forEach(b=>b.addEventListener("click",()=>{FILTER=b.dataset.k;renderNav();renderMain();}));
}
function renderMain(){
  const s=SECTIONS.find(x=>x.key===FILTER);
  const items=s.get(DATA);
  document.getElementById("secTitle").textContent=s.label;
  document.getElementById("secCount").textContent=items.length?`${items.length} ${items.length===1?"item":"items"}`:"";
  document.getElementById("main").innerHTML=items.length
    ? `<div class="records">${items.map(s.card).join("")}</div>`
    : `<div class="empty">Nothing here right now.</div>`;
}
function renderMini(){
  const c=DATA.contributions;
  const cells=[
    {n:c.length,l:"Authored"},
    {n:c.filter(r=>r.status==="merged").length,l:"Merged",cls:"merged"},
    {n:c.filter(r=>r.status==="review"||r.status==="awaiting").length,l:"In review"},
    {n:(DATA.potential_prs||[]).length,l:"To pick up",cls:"accent"},
  ];
  document.getElementById("mini").innerHTML=cells.map(x=>`<div class="cell"><div class="n ${x.cls||""}">${x.n}</div><div class="l">${x.l}</div></div>`).join("");
}

async function boot(){
  try{ DATA=await (await fetch("./data/contributions.json",{cache:"no-store"})).json(); }
  catch(e){ document.getElementById("main").innerHTML=`<div class="empty">Couldn't load data/contributions.json — serve over http (this page is at localhost / GitHub Pages). ${esc(String(e))}</div>`; return; }
  if(DATA.meta?.focus) document.getElementById("focus").textContent=DATA.meta.focus.split("—")[0].trim();
  renderMini(); renderNav(); renderMain();
}
document.getElementById("themeBtn").addEventListener("click",()=>{
  const now=document.documentElement.getAttribute("data-theme");
  const isDark=now?now==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
  document.documentElement.setAttribute("data-theme",isDark?"light":"dark");
});
boot();
</script>
</body>
</html>
